name: opercia

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: opercia
      POSTGRES_USER: ${POSTGRES_USER:-opercia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opercia}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
