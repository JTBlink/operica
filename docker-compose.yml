name: opercia

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-operica}
      POSTGRES_USER: ${POSTGRES_USER:-operica}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-operica}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
